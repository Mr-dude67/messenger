<!DOCTYPE html>

<html>
<head>
	<title>TicTacBOB Messenger</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	
	<div id="cursor"></div>
	
	<input placeholder="Username" style="cursor: none; position: absolute; left: 26vw; font-size: 16px;" id="username"></input>
	
	<div id="message-box"></div>
	<button onclick="input_msg()" class="button">Send Message</button>
	
	<input id="input" style="cursor: none; position: relative; top: 72vh; font-size: 16px;" placeholder="Enter message here"></input>
	
	
	<div id="emoji-box">
		<p>Emojis:</p>
		
		<button onclick="smileyInsert()" class="emoji-button">
			<img alt="Smiley emoji, click button to insert" src="smiley_emoji.jpg" class="emoji" draggable="false"></img>
		</button>
		
		<button onclick="poopInsert()" class="emoji-button">
			<img alt="Poop emoji, click button to insert" src="poop_emoji.jpg" class="emoji" draggable="false"></img>
		</button>
		
	</div>
	
	<script src="config.js"></script>
	<script src="script.js"></script>
</body>
</html>
