<!DOCTYPE html>

<html>
<head>
	<title>TicTacBOB Messenger</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	
	<div id="cursor"></div>
	
	<input placeholder="Username" style="cursor: none; position: absolute; left: 50%; transform: translateX(-50%); width: 200px; height: 60px;" id="username"></input>
	
	<div id="message-box"></div>
	
	<div id="message-div">
		<input id="input" placeholder="Enter message here"></input>
		<button onclick="input_msg()" class="button">➡️</button>
	</div>
	
	<div id="emoji-box">
		<p>Emojis:</p>
		
		<button onclick="smileyInsert()" class="emoji-button">
			<img alt="Smiley emoji, click button to insert" src="smiley_emoji.jpg" class="emoji" draggable="false"></img>
		</button>
		
		<button onclick="poopInsert()" class="emoji-button">
			<img alt="Poop emoji, click button to insert" src="poop_emoji.jpg" class="emoji" draggable="false"></img>
		</button>
		
	</div>

	<script src="script.js" defer></script>
</body>
</html>
