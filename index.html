<!DOCTYPE html>

<html>
<head>
	<title>TicTacBOB Messenger</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	
	<div id="cursor"></div>
	
	<input placeholder="Username" style="cursor: none; position: absolute; left: 20vw;" id="username"></input>
	
	<div id="message-box"></div>
	
	<input id="input" style="cursor: none; position: relative; top: 55vh;" placeholder="Enter message here"></input>
	
	<button onclick="input_msg()" class="button">template</button>

	<script src="script.js" defer></script>
</body>
</html>
